# ============================================================
# nginx.conf — GarbageBPFilter v3.0 Docker Compose 反向代理
# 用于 docker-compose --profile production 模式
#
# HTTPS 启用方式：
#   1. 将证书放到 ./nginx-certs/ 目录（fullchain.pem + privkey.pem）
#   2. 在 .env 中设置 DOMAIN=your-domain.com
#   3. 在 docker-compose.yml 中取消 nginx-ssl profile 的注释
#   4. docker-compose --profile production up -d
# ============================================================

upstream app {
    server app:3001;
}

# 上传文件大小限制（应用层 multer 限 50MB，留 multipart 编码余量）
client_max_body_size 60m;
client_body_timeout 120s;

# ── HTTP 服务（默认） ──
server {
    listen 80;
    server_name _;

    # 安全头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    # 注意：HSTS 只能加在 HTTPS server 块（浏览器忽略 http:// 上的 HSTS）。
    # 启用 HTTPS 时在 443 server 块加：
    #   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # API 请求转发到 Node.js 后端
    location /api/ {
        proxy_pass http://app;
        proxy_connect_timeout  10s;
        proxy_send_timeout     60s;
        # 与 Node 侧 server.timeout=120s 对齐（留 10s 余量）。
        # workspace SSE 长连接靠 15s 心跳保活，不受此限制影响。
        proxy_read_timeout     130s;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
    }

    # 前端静态资源
    location / {
        proxy_pass http://app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 健康检查
    location /health {
        access_log off;
        proxy_pass http://app/api/health;
    }
}

# ── HTTPS 配置说明 ──
# 如需启用 HTTPS，请使用 nginx-ssl.conf：
#   1. 将证书放到 ./nginx-certs/fullchain.pem 和 ./nginx-certs/privkey.pem
#   2. 修改 docker-compose.yml 中 nginx volumes 挂载 nginx-ssl.conf
#   3. docker-compose --profile production up -d
