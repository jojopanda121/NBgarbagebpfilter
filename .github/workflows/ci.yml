# ============================================================
# GitHub Actions CI/CD 流水线
#
# 触发条件：push 到 main 分支 或 PR 合并到 main
# 流程：
#   1. 代码规范检查（ESLint）
#   2. 构建前端
#   3. 构建 Docker 镜像
#   4. （可选）推送到镜像仓库
# ============================================================

name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ── 代码规范检查 ──
  lint:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install server dependencies
        run: cd server && npm ci

      - name: Install client dependencies
        run: cd client && npm ci

      - name: Lint server (ESLint)
        run: cd server && npx eslint . --ext .js --max-warnings 0

      - name: Test server (unit)
        run: cd server && npm test -- --runInBand

      # P1-2: 集成测试 — 真 SQLite :memory: 跑全部迁移 + supertest 完整 HTTP 栈
      - name: Test server (integration)
        run: cd server && npm run test:integration

      - name: Build client
        run: cd client && npm run build

  # ── Docker 镜像构建 ──
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Build main app image
        run: docker build -t bp-filter-app:${{ github.sha }} .

      - name: Build doc-service image
        run: docker build -t bp-filter-doc:${{ github.sha }} ./doc-service

      # ── P2-6: 推送镜像（配置好三个 secrets 后自动生效，未配置时静默跳过）──
      # 需要的 secrets：DOCKER_REGISTRY（如 ccr.ccs.tencentyun.com/yourns）、
      #                DOCKER_USERNAME、DOCKER_PASSWORD
      # 推送 sha 与 latest 双 tag；回滚 = 服务器上拉取上一个 sha tag 重启。
      - name: Push images (skipped unless registry secrets configured)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
          REGISTRY_USER: ${{ secrets.DOCKER_USERNAME }}
          REGISTRY_PASS: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          if [ -z "$REGISTRY" ] || [ -z "$REGISTRY_USER" ]; then
            echo "Registry secrets not configured — skipping image push."
            exit 0
          fi
          echo "$REGISTRY_PASS" | docker login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin
          for img in app doc; do
            docker tag "bp-filter-$img:${{ github.sha }}" "$REGISTRY/bp-filter-$img:${{ github.sha }}"
            docker tag "bp-filter-$img:${{ github.sha }}" "$REGISTRY/bp-filter-$img:latest"
            docker push "$REGISTRY/bp-filter-$img:${{ github.sha }}"
            docker push "$REGISTRY/bp-filter-$img:latest"
          done

